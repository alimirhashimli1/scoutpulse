version: '3.8'

services:
  # Identity Service Database
  identity-db:
    image: postgres:15-alpine
    environment:
      POSTGRES_USER: user
      POSTGRES_PASSWORD: password
      POSTGRES_DB: identity_db
    volumes:
      - identity_db_data:/var/lib/postgresql/data
      - ./apps/identity-svc/db/schema.sql:/docker-entrypoint-initdb.d/schema.sql
    networks:
      - scoutpulse-net

  # Football Service Database
  football-db:
    image: postgres:15-alpine
    environment:
      POSTGRES_USER: user
      POSTGRES_PASSWORD: password
      POSTGRES_DB: football_db
    volumes:
      - football_db_data:/var/lib/postgresql/data
    networks:
      - scoutpulse-net

  # Microservices
  identity-svc:
    build:
      context: .
      dockerfile: apps/identity-svc/Dockerfile
    environment:
      - DB_HOST=identity-db
      - DB_PORT=5432
      - DB_USER=user
      - DB_PASSWORD=password
      - DB_NAME=identity_db
    depends_on:
      - identity-db
    ports:
      - "8080:8080"
    networks:
      - scoutpulse-net

  football-svc:
    build:
      context: .
      dockerfile: apps/football-svc/Dockerfile
    depends_on:
      - football-db
    networks:
      - scoutpulse-net

  # Frontend
  frontend:
    build:
      context: .
      dockerfile: apps/frontend/Dockerfile
    ports:
      - "4200:80"
    depends_on:
      - identity-svc
      - football-svc
    networks:
      - scoutpulse-net

networks:
  scoutpulse-net:
    driver: bridge

volumes:
  identity_db_data:
  football_db_data:
