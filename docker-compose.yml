services:
  # Identity Service Database
  postgres-identity:
    image: postgres:15-alpine
    environment:
      POSTGRES_USER: user
      POSTGRES_PASSWORD: password
      POSTGRES_DB: identity_db
    volumes:
      - identity_db_data:/var/lib/postgresql/data
      - ./apps/identity-svc/migrations/000001_create_users_table.up.sql:/docker-entrypoint-initdb.d/01_create_users_table.sql
    networks:
      - scoutpulse-net

  # Football Service Database
  postgres-football:
    image: postgres:15-alpine
    environment:
      POSTGRES_USER: user
      POSTGRES_PASSWORD: password
      POSTGRES_DB: football_db
    ports:
      - "5434:5432"
    volumes:
      - football_db_data:/var/lib/postgresql/data
      - ./apps/football-svc/migrations/000001_init_football_schema.up.sql:/docker-entrypoint-initdb.d/01_init_football_schema.sql
    networks:
      - scoutpulse-net

  # Microservices
  identity-svc:
    build:
      context: .
      dockerfile: apps/identity-svc/Dockerfile
    restart: on-failure
    environment:
      - DB_HOST=postgres-identity
      - DB_PORT=5432
      - DB_USER=user
      - DB_PASSWORD=password
      - DB_NAME=identity_db
    depends_on:
      - postgres-identity
    ports:
      - "8080:8080"
    networks:
      - scoutpulse-net

  football-svc:
    build:
      context: .
      dockerfile: apps/football-svc/Dockerfile
    restart: on-failure
    environment:
      - DB_HOST=postgres-football
      - DB_PORT=5432
      - DB_USER=user
      - DB_PASSWORD=password
      - DB_NAME=football_db
    ports:
      - "8081:8081"
    depends_on:
      - postgres-football
    networks:
      - scoutpulse-net

  # Frontend
  frontend:
    build:
      context: .
      dockerfile: apps/frontend/Dockerfile
    ports:
      - "4200:80"
    depends_on:
      - identity-svc
      - football-svc
    networks:
      - scoutpulse-net

networks:
  scoutpulse-net:
    driver: bridge

volumes:
  identity_db_data:
  football_db_data:
