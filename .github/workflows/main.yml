name: ScoutPulse CI/CD

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]

env:
  GO_VERSION: "1.25"

jobs:
  # One matrix entry per Go module. Adding a service means adding one line
  # here, rather than copying a whole job block.
  build:
    name: ${{ matrix.module }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        module:
          - apps/identity-svc
          - apps/football-svc
          - libs/auth
          - libs/db
          - libs/platform
          - tests/integration
    steps:
      - uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
          cache-dependency-path: ${{ matrix.module }}/go.sum

      - name: Verify go.mod is tidy
        working-directory: ${{ matrix.module }}
        run: |
          go mod tidy
          git diff --exit-code -- go.mod go.sum

      - name: Check formatting
        working-directory: ${{ matrix.module }}
        run: |
          unformatted=$(gofmt -l .)
          if [ -n "$unformatted" ]; then
            echo "These files need gofmt:"
            echo "$unformatted"
            exit 1
          fi

      - name: Build
        working-directory: ${{ matrix.module }}
        run: go build ./...

      - name: Vet
        working-directory: ${{ matrix.module }}
        run: go vet ./...

      # golangci-lint v2 and action v8. v1 releases predate Go 1.25 and reject
      # a `go 1.25.0` module before linting anything, which silently disabled
      # this gate on the three largest modules. The config was migrated to the
      # v2 schema in the same change.
      - name: Lint
        uses: golangci/golangci-lint-action@v8
        with:
          version: v2.12.2
          working-directory: ${{ matrix.module }}
          args: --config=${{ github.workspace }}/.golangci.yml

      - name: Unit tests
        working-directory: ${{ matrix.module }}
        # -short skips the suites that need Docker; those run in the job below.
        run: go test -short -race ./...

  # Verifies the compose file parses and the schema applies cleanly, without
  # needing the services themselves to build.
  migrations:
    name: Migrations
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: postgres
        ports: ["5432:5432"]
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4

      - name: Install golang-migrate
        run: |
          curl -sSL https://github.com/golang-migrate/migrate/releases/download/v4.17.1/migrate.linux-amd64.tar.gz \
            | tar xvz -C /tmp
          sudo mv /tmp/migrate /usr/local/bin/migrate

      # Up then down then up again: a migration that cannot be rolled back and
      # re-applied is one you cannot safely deploy.
      - name: Apply, roll back, and re-apply every migration
        run: |
          set -e
          for svc in identity football; do
            psql "postgresql://postgres:postgres@localhost:5432/postgres" \
              -c "CREATE DATABASE ${svc}_test"
            url="postgresql://postgres:postgres@localhost:5432/${svc}_test?sslmode=disable"
            echo "::group::${svc}"
            migrate -path "apps/${svc}-svc/migrations" -database "$url" up
            migrate -path "apps/${svc}-svc/migrations" -database "$url" down -all
            migrate -path "apps/${svc}-svc/migrations" -database "$url" up
            echo "::endgroup::"
          done
        env:
          PGPASSWORD: postgres

      - name: Validate the compose file
        run: |
          # Generate a throwaway key pair so the required variables resolve.
          openssl genpkey -algorithm RSA -pkeyopt rsa_keygen_bits:2048 -out /tmp/priv.pem 2>/dev/null
          openssl rsa -in /tmp/priv.pem -pubout -out /tmp/pub.pem 2>/dev/null
          JWT_PRIVATE_KEY="$(cat /tmp/priv.pem)" JWT_PUBLIC_KEY="$(cat /tmp/pub.pem)" \
            docker compose config --quiet

  integration:
    name: Integration tests
    runs-on: ubuntu-latest
    needs: [build, migrations]
    steps:
      - uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}

      # Docker is available on ubuntu-latest runners, so the testcontainers
      # suites run for real here instead of skipping.
      #
      # Output is teed to a file as well as the log. Compose prints a line per
      # container per state change, which buries the one thing anybody reads
      # this job for -- the failing assertion. The summary step below reprints
      # it at the end.
      - name: Run integration tests
        id: run
        run: |
          set -o pipefail
          status=0
          for module in apps/identity-svc apps/football-svc tests/integration; do
            echo "::group::$module"
            if ! (cd "$module" && go test -timeout 20m ./... 2>&1) | tee -a "$RUNNER_TEMP/tests.log"; then
              status=1
            fi
            echo "::endgroup::"
          done
          exit $status

      # Runs only on failure, and is the last thing in the log.
      - name: Failure summary
        if: failure()
        run: |
          echo "=============== FAILING TESTS ==============="
          grep -nE '^(\s*)--- FAIL|^\s*Error Trace:|^\s*Error:|^\s*Messages:|^panic:|published ports' \
            -A 2 "$RUNNER_TEMP/tests.log" || echo "(no assertion output found — the failure was not a test assertion)"
          echo "============================================="
          echo
          echo "Package results:"
          grep -E '^(ok|FAIL|---)' "$RUNNER_TEMP/tests.log" | grep -v '^ok' || true

  # The frontend. A separate job rather than a matrix entry, because none of
  # the Go steps apply — there is no `go vet` for TypeScript, and the useful
  # checks here (a type-checked production build, a bundle budget, and the SSR
  # server actually rendering) have no Go equivalent.
  frontend:
    name: Frontend
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/frontend
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: apps/frontend/package-lock.json

      # ci, not install: it installs exactly the lockfile and fails if
      # package.json has drifted from it, which is the point in CI.
      - name: Install
        run: npm ci

      - name: Check formatting
        run: npx prettier --check "src/**/*.{ts,html,css}"

      # The production build is the type check. Angular's compiler checks
      # templates too, so this catches a renamed property used in an HTML
      # binding — which `tsc` alone does not see. It also enforces the bundle
      # budgets in angular.json.
      - name: Build
        run: npm run build

      - name: Unit tests
        run: npx ng test --watch=false

      # The check that has actually caught things: a build can succeed while
      # SSR silently falls back to client rendering — an Angular 21 host-header
      # mismatch does exactly that, and presents as a working build serving
      # empty pages. Asserting on rendered markup is the only way to see it.
      - name: SSR renders real content
        run: |
          node dist/frontend/server/server.mjs &
          server_pid=$!
          trap 'kill $server_pid 2>/dev/null || true' EXIT

          # Wait for the port rather than sleeping a fixed amount.
          for _ in $(seq 1 30); do
            if curl -fsS -o /dev/null http://localhost:4000/ 2>/dev/null; then break; fi
            sleep 1
          done

          html="$(curl -fsS http://localhost:4000/)"

          # The shell proves the app rendered server-side rather than shipping
          # an empty index.html for the browser to fill in.
          echo "$html" | grep -q "<app-shell" \
            || { echo "SSR produced no shell — check NG_ALLOWED_HOSTS"; exit 1; }

          # SEO metadata is the reason this app is server-rendered at all, so
          # its absence is a failure, not a warning.
          echo "$html" | grep -q 'property="og:title"' \
            || { echo "no Open Graph tags in the server-rendered HTML"; exit 1; }
          echo "$html" | grep -q 'rel="canonical"' \
            || { echo "no canonical link in the server-rendered HTML"; exit 1; }

          # A private route must NOT be server-rendered: it would leak a
          # signed-out shell into the index and evaluate guards against a
          # session the server does not have.
          account="$(curl -fsS http://localhost:4000/account)"
          if echo "$account" | grep -q "<app-account-page"; then
            echo "/account was server-rendered; it must be RenderMode.Client"
            exit 1
          fi

          # An unknown URL must answer 404, not 200. This regressed once
          # already: a wildcard route that resolves to a component is still a
          # match, so the render succeeds and the status stays 200 while the
          # page says "not found". It only works while every real route is
          # enumerated in app.routes.server.ts, which is easy to forget when
          # adding a page — so it is asserted rather than trusted.
          missing_status="$(curl -s -o /dev/null -w '%{http_code}' http://localhost:4000/nope)"
          [ "$missing_status" = "404" ] \
            || { echo "unknown URL answered $missing_status, expected 404 (soft 404)"; exit 1; }

          # And a real page must still be 200 — the enumeration above can just
          # as easily 404 something that exists.
          home_status="$(curl -s -o /dev/null -w '%{http_code}' http://localhost:4000/clubs)"
          [ "$home_status" = "200" ] \
            || { echo "/clubs answered $home_status; check the server route list"; exit 1; }

          echo "SSR checks passed."

      # Builds the runtime image the compose stack uses. Catches a Dockerfile
      # that has drifted from the build — a missing dependency or a moved
      # output path — without needing the whole stack up.
      #
      # The context is the repository root, because the Dockerfile copies
      # repo-relative paths (apps/frontend/package.json). Two levels up from
      # this job's working directory.
      - name: Build the container image
        run: docker build -f apps/frontend/Dockerfile -t scoutpulse-frontend:ci .
        working-directory: .
