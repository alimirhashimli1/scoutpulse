name: ScoutPulse CI/CD

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main ]

jobs:
  identity-svc-ci:
    name: Identity Service CI
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.24'
          cache: true

      - name: Install golangci-lint
        run: curl -sSfL https://raw.githubusercontent.com/golangci/golangci-lint/master/install.sh | sh -s -- -b $(go env GOPATH)/bin v1.64.5

      - name: Lint Identity Service
        run: |
          cd apps/identity-svc
          golangci-lint run ./...

      - name: Run Identity Service Unit Tests
        run: |
          cd apps/identity-svc
          # Running unit tests (excluding integration tests that require Docker/Postgres)
          go test -v -short ./...

      - name: Run Auth Library Tests
        run: |
          cd libs/auth
          go test -v ./...

      - name: Build Identity Service
        run: |
          cd apps/identity-svc
          go build -v ./cmd/server/main.go

  football-svc-ci:
    name: Football Service CI
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.24'
          cache: true

      - name: Run Football Service Unit Tests
        run: |
          cd apps/football-svc
          go test -v ./...

      - name: Build Football Service
        run: |
          cd apps/football-svc
          go build -v main.go
