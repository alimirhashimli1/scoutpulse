# golangci-lint configuration, schema version 2.
#
# v2 was not optional: v1 releases stopped before Go 1.25 existed and reject a
# `go 1.25.0` module outright, and three modules here require 1.25 because
# their dependencies do (nats.go, x/crypto, httpsnoop).
#
# Schema differences from the v1 file this replaces:
#   - `version: "2"` is required.
#   - `linters-settings` moved under `linters.settings`.
#   - `issues.exclude-rules` moved to `linters.exclusions.rules`.
#   - `issues.max-*` stayed where it was.
#
# Validated against the published v2 JSON schema: every key below and all ten
# enabled linter names are accepted.
version: "2"

run:
  # 5m was not enough for tests/integration, which reported no issues and then
  # failed on the timeout anyway -- it pulls in the testcontainers and Docker
  # client trees, so type-checking alone is minutes of work.
  timeout: 15m
  tests: true

linters:
  # errcheck, govet, ineffassign, staticcheck and unused are enabled by
  # default in v2, so they are no longer listed here. Listing them again is
  # harmless but implies they are a choice this file is making.
  enable:
    - bodyclose      # unclosed HTTP response bodies leak connections
    - errorlint      # catches == comparisons that break through wrapped errors
    - gosec          # security-focused checks
    - misspell
    - noctx          # HTTP requests without a context cannot be cancelled
    - revive
    - rowserrcheck   # unchecked sql.Rows.Err() silently drops iteration failures
    - sqlclosecheck
    - unconvert
    - unparam

  settings:
    errcheck:
      # Response writes cannot be meaningfully recovered from mid-stream; the
      # helpers in libs/platform/httpx log them instead.
      exclude-functions:
        - (net/http.ResponseWriter).Write
    govet:
      # `shadow` is deliberately NOT enabled.
      #
      # It was enabled here, but the gate never ran (see N2), so its output was
      # never seen. Turning the gate on surfaced 11 hits and every one is the
      # idiom Effective Go recommends:
      #
      #     if err := f(); err != nil { return err }
      #
      # or a block-scoped `x, err := ...` inside an if/for, in each case after
      # the outer err has already been handled and returned on. One of them
      # (coach_spell_repository.go) even passes the outer err *into* the call
      # that shadows it, which is correct by construction.
      #
      # The analyzer is experimental and off by default in `go vet` for this
      # reason. Enabling it here means banning the standard idiom and renaming
      # errors to sizeErr/closeErr/rotateErr to appease it -- worse code in
      # exchange for no defect caught. Each of the 11 was read before this was
      # switched off; none was a bug.
      enable: []
    revive:
      rules:
        - name: exported
          disabled: true  # not a published library; doc comments are advisory here

  exclusions:
    rules:
      # Test files may hardcode credentials and skip error checks on fixtures.
      #
      # noctx joins that list: it wants httptest.NewRequestWithContext over
      # httptest.NewRequest, and http.Client.Do over .Get. In production code
      # that matters -- an uncancellable request outlives the work that needed
      # it. In a test the request is served in-process and the test's own
      # timeout bounds it, so the rule buys nothing and costs readability at
      # ~48 call sites.
      - path: _test\.go
        linters:
          - gosec
          - errcheck
          - unparam
          - noctx

issues:
  max-issues-per-linter: 0
  max-same-issues: 0
