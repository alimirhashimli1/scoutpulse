global:
  scrape_interval: 15s
  evaluation_interval: 15s

scrape_configs:
  # One job per service. Adding a service means one more entry here; the
  # metric names and labels are identical across services because they all
  # come from libs/platform/observability.
  - job_name: identity-svc
    static_configs:
      - targets: ["identity-svc:8080"]

  - job_name: football-svc
    static_configs:
      - targets: ["football-svc:8081"]

  - job_name: nats
    metrics_path: /varz
    static_configs:
      - targets: ["nats:8222"]
