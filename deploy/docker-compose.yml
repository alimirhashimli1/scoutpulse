version: '3.8'

services:
  identity-db:
    image: postgres:15-alpine
    environment:
      POSTGRES_USER: user
      POSTGRES_PASSWORD: password
      POSTGRES_DB: identity_db
    volumes:
      - identity_db_data:/var/lib/postgresql/data
      # Mount the schema so it runs on startup
      - ../apps/identity-svc/db/schema.sql:/docker-entrypoint-initdb.d/schema.sql
    networks:
      - scoutpulse-net

  identity-svc:
    build:
      context: ..
      dockerfile: apps/identity-svc/Dockerfile
    environment:
      - DB_HOST=identity-db
      - DB_PORT=5432
      - DB_USER=user
      - DB_PASSWORD=password
      - DB_NAME=identity_db
    depends_on:
      - identity-db
    ports:
      - "8080:8080"
    networks:
      - scoutpulse-net

networks:
  scoutpulse-net:
    driver: bridge

volumes:
  identity_db_data:
