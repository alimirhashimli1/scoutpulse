<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <!--
    A real title and description, rather than the generated "Frontend".

    Both are defaults: every page with an entity behind it replaces them from
    its own data through `Seo`, during the server render. These are what a
    crawler sees for a page that has not set its own — and what a visitor sees
    in the tab before the first render completes.
  -->
    <title>ScoutPulse — the football scouting portal</title>
    <meta
      name="description"
      content="A scouting portal for football. Search players, clubs and coaches, compare them side by side, and follow how squads take shape."
    />
    <base href="/" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <!--
      Two icons, and the order matters: a browser that understands SVG takes
      the last one it can use, and the vector stays sharp on a high-density
      screen and in the places a tab icon gets scaled up. The .ico carries
      16/32/48px rasters for everything older, and for Windows shortcuts.
    -->
    <link rel="icon" href="favicon.ico" sizes="16x16 32x32 48x48" />
    <link rel="icon" href="favicon.svg" type="image/svg+xml" />
    <!-- Matches the palette so the browser paints the right chrome and the
       first frame is not a white flash on a dark page. -->
    <meta name="color-scheme" content="light dark" />

    <!--
    Applies a saved theme before the first paint.

    This has to be inline and synchronous, in the head, ahead of the
    stylesheet. Doing it from Angular would run after the page had already
    painted in the system theme, producing exactly the flash of the wrong
    colours that setting a preference is meant to prevent — and it is most
    jarring for the person who deliberately chose light on a dark machine.

    Wrapped in try/catch because reading localStorage throws outright in some
    privacy modes, and an exception here would block the parser.
  -->
    <script>
      (function () {
        try {
          var choice = localStorage.getItem('scoutpulse.theme');
          if (choice === 'light' || choice === 'dark') {
            document.documentElement.setAttribute('data-theme', choice);
          }
        } catch (e) {
          /* No stored preference available; the system theme applies. */
        }
      })();
    </script>
  </head>
  <body>
    <app-root></app-root>
  </body>
</html>
